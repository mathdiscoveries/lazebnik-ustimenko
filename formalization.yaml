fidelity:
  divergences: >-
    The companion manuscript (Draft 3) counts 5 main results. This package's
    Lean library proves 4 of those 5 (3 results of the companion paper plus
    that paper's second proof of the earlier binary girth law of Cheng, Chen,
    and Tang 2014) unconditionally inside Lean 4 + Mathlib, and the Palomar
    comparison covers 1 of them in full and 2 in part with exact statement
    fidelity for what it compares. The
    5th result (the complete ternary D(k, 3) girth table for all k <= 50)
    combines Lean-verified cycle upper bounds with external exhaustive C BFS
    lower bounds on 17 non-tight dimensions (k in {27..30, 33..34, 36..46});
    those conditional BFS-bridge theorems are omitted from Challenge.lean, while
    all 27 unconditional tight ternary girths (including k = 15, 16, 47, 48, 55,
    56, 79, 80, 99, 103, 104) and 56 <= girth D(52, 3) <= 60 stand purely inside
    the Lean kernel.

