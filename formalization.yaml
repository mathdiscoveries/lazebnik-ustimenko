status:
  scope: >-
    Unconditional Lean 4 + Mathlib proof (208 audited declarations in
    LazebnikUstimenko, zero sorry, zero native_decide, standard axioms only)
    covering 4 of 5 main results of the companion manuscript (80%): (1) original
    proof of exact girth 14 for D(9, F) and D(10, F) over every finite field
    with |F| >= 4 in both sign models (including direct GaloisField p n
    instantiation, DS28 Table 7 cells (9, 27), (10, 27), (9, 32), (10, 32), and
    >= 2 admissible parameters); (2) independent Lean 4 kernel proof of the
    earlier complete binary girth law girth D(k, 2) = 2^s of Cheng, Chen, and
    Tang (2014) (quoted in Xu-Cheng-Tang 2023, Example 1) for all s >= 3 and
    2^(s-1) - 4 < k <= 2^s - 4 in both sign models via an affine unipotent
    4-step operator, together with its corollary refuting the LSW (2017) / DS28
    (2026) 16-cycle claim for all k >= 13; and (3) original unconditional
    kernel-verified exact ternary girths D(k, 3) at 27 dimensions (highlights at
    k = 15, 16, 47, 48, 55, 56, 79, 80, 99, 103, 104) plus 56 <= girth D(52, 3)
    <= 60. The 5th result in the companion manuscript (complete ternary girth
    table for all k <= 50) combines Lean-certified upper-bound cycles with
    external exhaustive C BFS lower bounds on 17 non-tight dimensions; those
    conditional BFS-bridge theorems remain in
    LazebnikUstimenko/CascadeAndDk3.lean and are omitted from the compared
    unconditional Challenge.lean statements.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

