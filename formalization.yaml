alignment:
  namespace: "LazebnikUstimenkoChallenge"
  theorems:
    - name: "D9_D10_exact_girth_14_all_q_ge_4"
      informal: "For every finite field F with |F| >= 4, both D(9, F) and D(10, F) have exact girth 14."
    - name: "D9_D10_orig_exact_girth_14_all_q_ge_4"
      informal: "For every finite field F with |F| >= 4, both D(9, F) and D(10, F) in the original minus-sign representation have exact girth 14."
    - name: "D9_D10_exact_girth_14_galoisField"
      informal: "For every prime power p^n >= 4 (n != 0), D(9, GF(p^n)) and D(10, GF(p^n)) have exact girth 14."
    - name: "DS28_table7_blank_cells_27_32"
      informal: "Closes the four empty DS28 Table 7 cells: D(9, 27), D(10, 27), D(9, 32), and D(10, 32) all have exact girth 14."
    - name: "card_admissible_ge_two_of_card_ge_four"
      informal: "Every finite field F with |F| >= 4 has at least two admissible parameters c for the universal 14-cycle family."
    - name: "D2_exact_girth_law"
      informal: "Complete binary girth law: girth D(k, 2) = 2^s for every s >= 3 and every k >= 2 with 2^(s-1) - 4 < k <= 2^s - 4."
    - name: "D2_exact_girth_orig_law"
      informal: "Complete binary girth law in the original minus-sign representation DGraphOrig."
    - name: "D2_girth_gt_16_of_ge_13"
      informal: "For every k >= 13, D(k, 2) has girth at least 32 and contains no 16-cycle, refuting the published 2^(k-3) C_16 claim."
    - name: "D3_exact_girths_highlights"
      informal: "Unconditional kernel-verified exact ternary girths: D(15,3)=D(16,3)=20, D(47,3)=D(48,3)=52, D(55,3)=D(56,3)=60, D(79,3)=D(80,3)=84, D(99,3)=104, and D(103,3)=D(104,3)=108."
    - name: "D3_k52_bounds_56_60"
      informal: "Unconditional tightening of the first open ternary dimension: 56 <= girth D(52, 3) <= 60."
