alignment:
  namespace: "LazebnikUstimenkoChallenge"
  theorems:
    - name: "D9_D10_exact_girth_14_all_q_ge_4"
      informal: "Theorem 5(b) of the companion paper: for every finite field F with |F| >= 4, both D(9, F) and D(10, F) have exact girth 14 (closing characteristics 2 and 3)."
    - name: "D9_D10_orig_exact_girth_14_all_q_ge_4"
      informal: "Theorem 5(b) of the companion paper: for every finite field F with |F| >= 4, both D(9, F) and D(10, F) in the original minus-sign representation have exact girth 14."
    - name: "D9_D10_exact_girth_14_galoisField"
      informal: "Theorem 5(b) of the companion paper: for every prime power p^n >= 4 (n != 0), D(9, GF(p^n)) and D(10, GF(p^n)) have exact girth 14."
    - name: "DS28_table7_blank_cells_27_32"
      informal: "Theorem 5(b) of the companion paper: closes the four empty DS28 Table 7 cells: D(9, 27), D(10, 27), D(9, 32), and D(10, 32) all have exact girth 14."
    - name: "card_admissible_ge_two_of_card_ge_four"
      informal: "Theorem 5(b) of the companion paper: every finite field F with |F| >= 4 has at least two admissible parameters c for the universal 14-cycle family."
    - name: "D2_exact_girth_law"
      informal: "Independent Lean 4 proof (via affine unipotent 4-step operator) of the earlier complete binary girth law of Cheng, Chen, and Tang (2014) (quoted in Xu-Cheng-Tang 2023, Example 1): girth D(k, 2) = 2^s for every s >= 3 and every k >= 2 with 2^(s-1) - 4 < k <= 2^s - 4."
    - name: "D2_exact_girth_orig_law"
      informal: "Independent Lean 4 proof of the Cheng-Chen-Tang (2014) complete binary girth law in the original minus-sign representation DGraphOrig."
    - name: "D2_girth_gt_16_of_ge_13"
      informal: "Corollary of the binary girth law refuting the LSW (2017) / DS28 (2026) 2^(k-3) C_16 survey claim: for every k >= 13, D(k, 2) has girth at least 32 and contains no 16-cycle."
    - name: "D3_exact_girths_highlights"
      informal: "Theorem 11(a) of the companion paper, kernel-verified exact ternary girths: D(15,3)=D(16,3)=20, D(47,3)=D(48,3)=52, D(55,3)=D(56,3)=60, D(79,3)=D(80,3)=84, D(99,3)=104, and D(103,3)=D(104,3)=108."
    - name: "D3_k52_bounds_56_60"
      informal: "Theorem 11(a) of the companion paper, unconditional tightening of the first open ternary dimension: 56 <= girth D(52, 3) <= 60."
