sources:
  - title: "Exact Girths of Lazebnik-Ustimenko Graphs D(k, q): Girth 14 Across All Characteristics, Binary Girth Law Verification, and Ternary Girths"
    authors:
      - "Tyler B. Hughes"
    id: "https://mathdiscoveries.org/results/lazebnik-ustimenko"
    type: original-proof
    location: "Companion manuscript (Draft 3), verification archive, and prior-work notes at https://mathdiscoveries.org/results/lazebnik-ustimenko"
    relationship: other
    author_endorsement: participated
    note: >-
      Original constructions, proofs, companion manuscript, and Lean 4 + Mathlib
      formalization produced by AI research agents built and directed by Tyler
      B. Hughes. Original contributions in this repository are: (a) the
      characteristic-free one-parameter rational 14-cycle family proving
      girth D(9, q) = girth D(10, q) = 14 for all prime powers q >= 4 (closing
      characteristics 2 and 3 and DS28 Table 7 cells (9, 27), (10, 27), (9, 32),
      (10, 32)) and the admissible-parameter lower bound >= 2; (b) the
      independent affine unipotent 4-step operator proof of the binary girth law
      and explicit corollary refuting the printed 2^(k-3) C_16 claim for k >= 13;
      and (c) unconditional kernel-verified exact ternary girths D(k, 3)
      including k = 15, 16, 47, 48, 55, 56, 79, 80, 99, 103, 104 and the bound
      56 <= girth D(52, 3) <= 60. The complete binary girth formula
      girth D(k, 2) = 2^s itself is an earlier theorem of Cheng, Chen, and Tang
