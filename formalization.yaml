version: "v0.4"

project:
  name: "Exact Girths of Lazebnik-Ustimenko Graphs D(k, q): Girth 14 for All |F| >= 4, Independent Proof of the Binary Girth Law, and Ternary Girths"
  description: >-
    Unconditional Lean 4 + Mathlib formalization (208 audited declarations, zero
    sorry, zero native_decide, standard axioms only) covering three families of
    exact girth theorems for the Lazebnik-Ustimenko algebraically defined
    bipartite graphs D(k, F), formalizing results of the companion paper,
    among them a second proof of an earlier binary theorem:
    (1) Theorem 5(b) of the companion paper: exact girth D(9, F) = girth D(10, F) = 14 for every
    finite field F with |F| >= 4 in both the working (DS28 Section 6.1) and
    original minus-sign representations, closing characteristics 2 and 3
    (q = 2^m >= 4 and q = 3^m >= 9, left open by Pikuta 2008), closing the
    empty DS28 Table 7 cells (9, 27), (10, 27), (9, 32), (10, 32), and proving
    at least two admissible cycle parameters exist whenever |F| >= 4;
    (2) Independent Lean 4 proof of the earlier complete binary girth law of
    Cheng, Chen, and Tang (2014) (quoted in Xu, Cheng, and Tang 2023, Example 1):
    girth D(k, 2) = 2^s for every s >= 3 and every k >= 2 with
    2^(s-1) - 4 < k <= 2^s - 4 in both sign models, proved independently via an
    affine unipotent 4-step operator T4(p) = (I + N)p + b over ZMod 2, and
    applied (D2_girth_gt_16_of_ge_13) to prove girth D(k, 2) >= 32 with no
    16-cycle for every k >= 13, refuting the conflicting printed claim
    D(k, 2) ~= 2^(k-3) C_16 (k >= 5) in Lazebnik-Sun-Wang (2017) and
    Lazebnik-Wang DS28 (2026); and
    (3) Kernel-verified exact ternary girths D(k, 3) (Theorem 11(a) of the
    companion paper) including
    k = 15, 16 (girth 20), k = 47, 48 (52), k = 55, 56 (60), k = 79, 80 (84),
    k = 99 (104), and k = 103, 104 (108), together with the unconditional
    tightening 56 <= girth D(52, 3) <= 60. Companion manuscript and verification
    archive: https://mathdiscoveries.org/results/lazebnik-ustimenko. Coverage
    by this package's Palomar comparison, against the 5 main results the
    companion paper counts: 1 is compared in Lean in full (20%; the binary
    girth law, Proposition 13) and 2 in part (Theorem 5(b), girth 14 in
    dimensions 9 and 10, for every finite field with at least 4 elements but
    not for infinite fields; Theorem 11(a), 11 of the 27 exact ternary girths,
    plus 56 <= girth D(52, 3) <= 60); the universal lower bound (Theorem
    5(a)) and the other 16 ternary girths are proved in this package's Lean
    library but not compared; the ternary table through k = 50 (Theorem
    11(b)) combines Lean upper bounds with external search lower bounds and is
    not compared. Theorems 7 and 9 and Proposition 10 of the paper, outside
    its count of five, are not proved in this package (it has only Theorem
    9's inputs from Theorem 5(b) and Proposition 13); Theorem 5(c), also
    outside the count, is in the library only as bridges that take the cited
    lifting theorems as hypotheses.
  authors:
    - "Tyler B. Hughes"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Tyler B. Hughes"

