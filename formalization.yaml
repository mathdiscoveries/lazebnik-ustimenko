version: "v0.4"

project:
  name: "Exact Girths of Lazebnik-Ustimenko Graphs D(k, q): Girth 14 for All |F| >= 4, Binary Girth Law, and Ternary Girths"
  description: >-
    Unconditional Lean 4 + Mathlib formalization (208 audited declarations, zero
    sorry, zero native_decide, standard axioms only) establishing three
    families of exact girth theorems for the Lazebnik-Ustimenko algebraically
    defined bipartite graphs D(k, F): (1) girth D(9, F) = girth D(10, F) = 14
    for every finite field F with |F| >= 4 in both the working (DS28 Section
    6.1) and original minus-sign representations, closing characteristics 2 and
    3 (q = 2^m >= 4 and q = 3^m >= 9, left open by Pikuta 2008), closing the
    empty DS28 Table 7 cells (9, 27), (10, 27), (9, 32), (10, 32), and proving
    at least two admissible cycle parameters exist whenever |F| >= 4; (2) the
    complete binary girth law girth D(k, 2) = 2^s for every s >= 3 and every
    k >= 2 with 2^(s-1) - 4 < k <= 2^s - 4 in both sign models, proving girth
    D(k, 2) >= 32 with no 16-cycle for every k >= 13 and refuting the
    published D(k, 2) ~= 2^(k-3) C_16 claim for k >= 5; and (3) unconditional
    kernel-verified exact ternary girths D(k, 3) including k = 15, 16 (girth
    20), k = 47, 48 (52), k = 55, 56 (60), k = 79, 80 (84), k = 99 (104), and
    k = 103, 104 (108), together with the unconditional tightening
    56 <= girth D(52, 3) <= 60. Companion manuscript and verification archive:
    https://mathdiscoveries.org/results/lazebnik-ustimenko.
  authors:
    - "Tyler B. Hughes"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Tyler B. Hughes"

