sources:
  - title: "Exact Girths of Lazebnik-Ustimenko Graphs D(k, q): Girth 14 Across All Characteristics, Binary Girth Law Verification, and Ternary Girths"
    authors:
      - "Tyler B. Hughes"
    id: "https://mathdiscoveries.org/results/lazebnik-ustimenko"
    type: paper
    location: "https://mathdiscoveries.org/results/lazebnik-ustimenko"
    relationship: formalizes
    author_endorsement: participated
    note: >-
      The companion paper (Draft 3). It states and proves in writing every
      compared statement of this package, and the Lean work formalizes them;
      the formalization presents no result that the paper does not. Compared
      statements come from Theorem 5(b) (girth 14 for D(9, q) and D(10, q) for
      all q >= 4, the four DS28 Table 7 cells, the admissible-parameter
      count), Proposition 13 and the remark after Table 2 (the binary girth
      law and the absence of 16-cycles for k >= 13) and Theorem 11(a)
      (ternary girths). Prior results proved here a second time: the binary
      girth law of Cheng, Chen, and Tang (2014) and the characteristic p > 3
      case of Pikuta (2008), both listed below. The paper's fifth main result
      (the ternary table through k = 50) uses external search lower bounds
      and is not in this package. AI research agents built and directed by
      Tyler B. Hughes generated and checked this work. No human mathematician
      has yet refereed the proof.
  - title: "On the girth of the bipartite graph D(k, q)"
    authors:
      - "Xiaoyan Cheng"
      - "Wenbing Chen"
      - "Yuansheng Tang"
    id: "https://doi.org/10.1016/j.disc.2014.07.004"
    type: paper
    location: "Discrete Math. 335 (2014), 25-34 (Zbl 1298.05227)"
    relationship: independently-proves
    author_endorsement: not-contacted
    note: >-
      Earlier published proof of the complete binary girth formula
      girth D(k, 2) = 2^s for all dimensions k >= 2 (verified via zbMATH
      1298.05227 and Xu-Cheng-Tang 2023 Example 1, which quotes the exact
      formula for every dimension and credits this paper as [19]; subscription
      journal PDF not yet read in full). Theorems D2_exact_girth_law and
      D2_exact_girth_orig_law in this repository prove the same binary girth
      law independently, formalizing Proposition 13 of the companion paper
      (an affine unipotent 4-step transition operator T4(p) = (I + N)p + b
      over ZMod 2 in both sign models), not a translation of the 2014 proof,
      which is unread [to check]; D2_girth_gt_16_of_ge_13 then
      records the immediate corollary refuting the later survey C_16 erratum for
      every k >= 13.
  - title: "Girth of the algebraic bipartite graph D(k, q)"
    authors:
      - "Ming Xu"
      - "Xiaoyan Cheng"
      - "Yuansheng Tang"
    id: "https://doi.org/10.1016/j.ffa.2023.102296"
    type: paper
    location: "Finite Fields Appl. 92 (2023), 102296 (arXiv:2209.01896), Theorem 2, Example 1 (p. 11), and Table 1 (p. 12)"
    relationship: background
    author_endorsement: not-contacted
    note: >-
